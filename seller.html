
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Registration | Soko Yangu</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f5;
  color: #1e293b;
}

header {
  background: #087f5b;
  color: white;
  text-align: center;
  padding: 20px;
}

.container {
  max-width: 480px;
  margin: 25px auto;
  padding: 20px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 15px #00000012;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

button {
  width: 100%;
  background: #087f5b;
  color: white;
  border: none;
  padding: 14px;
  margin-top: 22px;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}

a {
  color: #087f5b;
  text-decoration: none;
}

#message {
  text-align: center;
  margin-top: 15px;
}

footer {
  text-align: center;
  padding: 20px;
  color: #64748b;
}
</style>
</head>

<body>

<header>
  <h1>Soko Yangu</h1>
  <p>Kenya Marketplace 🇰🇪</p>
</header>

<div class="container">

<a href="index.html">← Back to Marketplace</a>

<h2>Become a Seller</h2>
<p>Register your business and start selling.</p>

<form id="sellerForm">

<label for="name">Full Name</label>
<input type="text" id="name" required>

<label for="business">Business Name</label>
<input type="text" id="business" required>

<label for="phone">Phone Number</label>
<input type="tel" id="phone"
placeholder="07XXXXXXXX" required>

<label for="location">Location</label>
<input type="text" id="location"
placeholder="e.g. Nairobi" required>

<label for="email">Email Address</label>
<input type="email" id="email" required>

<label for="password">Password</label>
<input type="password" id="password"
minlength="8" required>

<button type="submit">Register as a Seller</button>

</form>

<p id="message"></p>

<hr style="margin: 25px 0;">

<h2>Seller Login</h2>
<p>Already registered? Login below.</p>

<form id="loginForm">

<label for="loginEmail">Email Address</label>
<input type="email" id="loginEmail" required>

<label for="loginPassword">Password</label>
<input type="password" id="loginPassword" required>

<button type="submit">Login as a Seller</button>

</form>

<p id="loginMessage"></p>


</div>

<footer>
  © 2026 Soko Yangu
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const db = supabase.createClient(
  "https://pvhzkzadfdpvgvliirxr.supabase.co",
  "sb_publishable_Jd8HUSb-wBdrfDJTmXeNGQ_KH0Xe4Cz"
);

const form = document.getElementById("sellerForm");
const message = document.getElementById("message");
const button = form.querySelector("button");

async function saveSeller(user) {
  const details = user.user_metadata;

  const { error } = await db
    .from("Sellers")
    .upsert({
      id: user.id,
      name: details.name,
      business_name: details.business_name,
      phone: details.phone,
      location: details.location
    }, {
      onConflict: "id",
      ignoreDuplicates: true
    });

  if (error) throw error;

  message.style.color = "#087f5b";
  message.textContent =
    "Seller registration successful! Welcome to Soko Yangu.";

  form.reset();
  form.style.display = "none";
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  button.disabled = true;
  message.style.color = "#1e293b";
  message.textContent = "Creating your seller account...";

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await db.auth.signUp({
      email: email,
      password: password,
      options: {
        emailRedirectTo: window.location.origin +
          window.location.pathname,
        data: {
          name: document.getElementById("name").value.trim(),
          business_name: document.getElementById("business").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          location: document.getElementById("location").value.trim()
        }
      }
    });

    if (error) throw error;

    if (data.session) {
      await saveSeller(data.user);
    } else {
      message.style.color = "#087f5b";
      message.textContent =
        "Check your email and click the confirmation link to complete registration.";
      form.reset();
    }

  } catch (error) {
    message.style.color = "red";
    message.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

async function completeRegistration() {
  try {
    const { data, error } = await db.auth.getSession();

    if (error) throw error;

    if (data.session) {
      const user = data.session.user;

      if (user.user_metadata.business_name) {
        await saveSeller(user);
      }
    }
  } catch (error) {
    message.style.color = "red";
    message.textContent = error.message;
  }
}

async function loginSeller(email, password) {
  const { data, error } =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) throw error;

  return data.user;
}


const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");

loginForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const loginButton = loginForm.querySelector("button");
  loginButton.disabled = true;

  loginMessage.style.color = "#1e293b";
  loginMessage.textContent = "Logging in...";

  try {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    const user = await loginSeller(email, password);

    if (user.user_metadata.business_name) {
      await saveSeller(user);
    }

    loginMessage.style.color = "#087f5b";
    loginMessage.textContent = "Login successful! Welcome to Soko Yangu.";

    loginForm.reset();
    form.style.display = "none";

  } catch (error) {
    loginMessage.style.color = "red";
    loginMessage.textContent = error.message;

  } finally {
    loginButton.disabled = false;
  }
});


completeRegistration();
</script>


</body>
</html>
